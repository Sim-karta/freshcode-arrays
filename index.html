<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./assets/styles/reset.css" />
        <link rel="stylesheet" href="./assets/styles/styles.css" />
        <script src="./assets/scripts/basic.js" defer></script>
        <script src="./assets/scripts/traversal.js" defer></script>
        <script src="./assets/scripts/objectArray.js" defer></script>
    </head>
    <body>
        <div class="basic-oper">
            <button class="print-array-btn">Вивести масив</button>
            <button class="remove-extreme-el-btn">
                Видалити крайні елементи
            </button>
            <button class="add-extreme-el-btn">Додати крайні елементи</button>
            <button class="print-array-copies-btn">Вивести копії масиву</button>
        </div>
        <div class="traversal">
            <button class="filter-nonzero-btn">Відфільтрувати нулі</button>
            <button class="map-divide-btn">Поділити всі елементи на 100</button>
            <button class="forEach-cube-btn">
                Вивести куби кожного елемента
            </button>
            <button class="find-square-100-btn">
                Знайти елемент квадрат якого = 100
            </button>
            <button class="find-greater-50-btn">
                Знайти елемент більше 50
            </button>
        </div>
        <div class="object-array">
            <button class="print-users-btn">Вивести користувачів</button>
            <button class="print-not-subscribed-btn">
                Вивести не підписаних користувачів
            </button>
            <button class="print-full-names-btn">Вивести повні імена</button>
            <button class="change-user-email-btn">Змінити email користувача</button>
            <button class="print-subscribe-percent-btn">
                Вивести відсоток підписаних
            </button>
            <button class="sort-users-by-age-btn">Сортувати користувачів за віком</button>
        </div>
    </body>
</html>
